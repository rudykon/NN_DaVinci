[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-davinci"
version = "0.7.3"
description = "Local-first neural-network analysis and editable scientific-figure studio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "NN_DaVinci contributors"}]
dependencies = []

[project.optional-dependencies]
onnx = ["onnx>=1.14"]
web = ["flask>=3"]
export = ["cairosvg>=2.7", "python-pptx>=1"]
yaml = ["PyYAML>=6"]
pytorch = ["torch>=2.1"]
runtime = ["torch>=2.1", "torchlens>=0.1"]
keras = ["keras>=3"]
tensorflow = ["tensorflow>=2.20"]
jax = ["jax>=0.4"]
explain = ["torchcam>=0.4", "torchvision>=0.16", "pillow>=10", "numpy>=1.26"]
all = [
  "onnx>=1.14", "flask>=3", "cairosvg>=2.7", "python-pptx>=1",
  "PyYAML>=6", "torch>=2.1", "torchlens>=0.1", "keras>=3", "tensorflow>=2.20", "jax>=0.4",
  "torchcam>=0.4", "torchvision>=0.16", "pillow>=10", "numpy>=1.26"
]

[project.scripts]
nnviz = "nn_davinci.cli:main"
nn-davinci = "nn_davinci.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
nn_davinci = [
  "web/*",
  "figure_templates/*.nndv.json",
  "scene_templates/*.scene.json",
  "assets/fonts/*.ttf",
  "assets/fonts/licenses/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
